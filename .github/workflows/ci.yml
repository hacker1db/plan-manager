# Untrusted pull request CI. Runs the PR's own code with no secrets, no id-token, no write
# permissions and no caches, so it is safe for pull requests from forks. It cannot see real Vercel
# settings; the trusted drift audit and release workflows do that. `ci-required` is the single
# status the main ruleset requires. See docs/operations/ci-cd.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; every push to main runs to completion so release.yml sees it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Environment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm contract:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: pnpm typecheck
      - run: pnpm typecheck:cli

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: pnpm test
      - run: pnpm test:contracts

  build:
    name: Production-equivalent build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Production build with contract fixtures (must pass)
        run: node scripts/ci-production-build.mjs
      - name: Production build with an empty environment (must fail, naming every variable)
        run: node scripts/ci/empty-env-build.mjs

  contract-gate:
    name: Contract-change gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Require owner confirmation for new requirements
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/contract-gate.mjs --base "$BASE_SHA"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline --config .github/zizmor.yml --min-severity low .github

  ci-required:
    name: ci-required
    if: always()
    needs: [contract, typecheck, test, build, contract-gate, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job must succeed (contract-gate may be skipped only on push)
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          bad="$(jq -r 'to_entries[]
            | select(.value.result != "success" and (.key != "contract-gate" or .value.result != "skipped" or env.EVENT != "push"))
            | "\(.key): \(.value.result)"' <<< "$RESULTS")"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "All required jobs succeeded."

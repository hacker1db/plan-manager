# Pre-merge guard for hosted deploys: runs the production build, including the fail-closed
# hosted environment check, with non-secret fixtures. It uses no secrets and has read-only
# permissions, so it is safe on pull requests from forks. It cannot see the real Vercel settings;
# see docs/hosting.md "Preventing failed production deploys".
name: hosted-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Production-equivalent build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hosted environment guard and contract tests
        run: node --import tsx --test test/hosted/build-env.test.ts
      - name: Production build with fixture environment
        run: node scripts/ci-production-build.mjs

# zizmor configuration. Every ignore states its reason. See docs/operations/ci-cd.md.
rules:
  self-repository:
    # The `$/` self-repository syntax is not understood by actionlint v1.7.12 (pinned in ci.yml),
    # which rejects it as an invalid action reference. `./` resolves to the same checked-out
    # composite action, so there is no security difference. Revisit when actionlint supports it.
    disable: true

name: PlanManager
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.7.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: dev.example.PlanManager
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_PlanServiceURL: "$(PLAN_SERVICE_URL)"
    INFOPLIST_KEY_ClerkPublishableKey: "$(CLERK_PUBLISHABLE_KEY)"
    PLAN_SERVICE_URL: ""
    CLERK_PUBLISHABLE_KEY: ""
targets:
  PlanManager:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Clerk
        product: ClerkKit
  PlanManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PlanManager
schemes:
  PlanManager:
    build:
      targets:
        PlanManager: all
    test:
      targets: [PlanManagerTests]

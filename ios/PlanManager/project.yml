name: PlanManager
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WorkOS:
    url: https://github.com/workos/workos-ios
    exactVersion: 0.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: dev.example.PlanManager
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_PlanServiceURL: "$(PLAN_SERVICE_URL)"
    INFOPLIST_KEY_WorkOSClientID: "$(WORKOS_CLIENT_ID)"
    INFOPLIST_KEY_WorkOSRedirectURI: "$(WORKOS_REDIRECT_URI)"
    PLAN_SERVICE_URL: ""
    WORKOS_CLIENT_ID: ""
    WORKOS_REDIRECT_URI: ""
targets:
  PlanManager:
    type: application
    platform: iOS
    sources:
      - Sources
      # The reader loads the web dashboard stylesheet verbatim so iOS and web cannot drift.
      - path: ../../src/dashboard/style.css
        buildPhase: resources
    dependencies:
      - package: WorkOS
        product: WorkOS
  PlanManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PlanManager
schemes:
  PlanManager:
    build:
      targets:
        PlanManager: all
    test:
      targets: [PlanManagerTests]
